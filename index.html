<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body> 
    <div class="card">
        <div class="search">
            <input id="cityInput" type="text" placeholder="enter city name" spellchecl="false">
            <button><img src="images/search.png" alt=""></button>
        </div>
        <div class="weather">
            <img src="images/rain.png" alt="rain icon" id="weatherIcon" class="weather-icon">
            <h1 id="temp" class="temp">22°c</h1>
            <h2 id="city" class="city">New York</h2>
        </div>
        <div class="details">
            <div class="col">
                <img src="images/humidity.png" alt="humidity icon">
                <div>
                    <p id="humidity" class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="col">
                <img src="images/wind.png">
                <div>
                    <p id="wind" class="wind">15km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
    </div> 
</body>
<script src="script.js"></script>
</html>
